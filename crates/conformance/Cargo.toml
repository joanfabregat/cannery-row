[package]
name = "conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "form", "query", "tokio"] }
base64 = "=0.22.1"
jsonschema = { version = "=0.58.5", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["cookies", "json", "rustls-tls"] }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
