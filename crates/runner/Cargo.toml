[package]
name = "cannery-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
ring.workspace = true
bollard = { version = "=0.21.1", default-features = false, features = ["pipe"] }
http = "=1.5.0"
kube = { version = "=4.2.0", default-features = false, features = ["client", "ws", "rustls-tls", "ring"] }
k8s-openapi = { version = "=0.28.0", default-features = false, features = ["v1_34"] }
tar = { version = "=0.4.46", default-features = false }
cannery-core = { path = "../core", version = "=0.1.0" }
cannery-research = { path = "../research", version = "=0.1.0" }
flate2 = { version = "=1.1.10", default-features = false, features = ["miniz_oxide"] }
getrandom.workspace = true
nix = { workspace = true, features = ["fs"] }
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
rustix = { workspace = true, features = ["process", "stdio"] }
sha2.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
serde_json.workspace = true
uuid.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
signal-hook.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio-tungstenite = "=0.29.0"
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
