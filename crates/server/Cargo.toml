[package]
name = "cannery-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
conformance-testing = ["cannery-core/conformance-testing"]

[dependencies]
cannery-storage = { path = "../storage", version = "=0.1.0" }
speedate.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
getrandom.workspace = true
httpdate.workspace = true
jsonschema = { version = "=0.58.5", default-features = false }
md-5.workspace = true
cannery-core = { path = "../core", version = "=0.1.0" }
cannery-identity = { path = "../identity", version = "=0.1.0" }
cannery-projects = { path = "../projects", version = "=0.1.0" }
cannery-research = { path = "../research", version = "=0.1.0" }
cannery-tracks = { path = "../tracks", version = "=0.1.0" }
cannery-units = { path = "../units", version = "=0.1.0" }
cannery-reviews = { path = "../reviews", version = "=0.1.0" }
cannery-attention = { path = "../attention", version = "=0.1.0" }
cannery-attempts = { path = "../attempts", version = "=0.1.0" }
cannery-jobs = { path = "../jobs", version = "=0.1.0" }
cannery-metrics = { path = "../metrics", version = "=0.1.0" }
cannery-search = { path = "../search", version = "=0.1.0" }
cannery-comments-reports = { path = "../comments-reports", version = "=0.1.0" }
mime_guess.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
ring.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
utoipa.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["unbounded_depth"] }
tokio = { workspace = true, features = ["test-util"] }
