version: 2
updates:
  # The runtime base of Containerfile.rust, pinned by digest. Only the
  # digest of the pinned tag moves; a new Debian release changes by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  # Workflow actions, pinned by commit SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
