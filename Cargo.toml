[workspace]
members = ["crates/core", "crates/identity", "crates/projects", "crates/server", "crates/cannery", "crates/runner", "crates/research", "crates/tracks", "crates/metrics", "crates/jobs", "crates/hypotheses", "crates/search", "crates/reviews", "crates/attention", "crates/comments-reports", "crates/attempts", "crates/storage", "crates/imports", "crates/managed-postgres", "crates/test-launcher"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[workspace.dependencies]
serde-saphyr = { version = "=0.0.29", default-features = false, features = ["deserialize"] }
speedate = "=0.17.0"
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["rt-tokio", "http-1x"] }
aws-config = { version = "=1.12.0", default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-smithy-http-client = { version = "=1.5.0", default-features = false, features = ["rustls-ring", "rt-tokio"] }
aws-smithy-runtime-api = { version = "=1.19.0", default-features = false, features = ["client"] }
aws-smithy-types = { version = "=1.8.1", default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "form", "query", "tokio", "matched-path"] }
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
futures-util = "=0.3.34"
getrandom = "=0.4.3"
httpdate = "=1.0.3"
md-5 = "=0.10.6"
mimalloc = "=0.1.52"
mime_guess = "=2.0.5"
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }
num-bigint = "=0.4.8"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
percent-encoding = "=2.3.2"
ring = "=0.17.14"
rust-embed = { version = "=8.12.0", features = ["debug-embed"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "=0.10.9"
signal-hook = { version = "=0.4.4", default-features = false }
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "macros", "runtime-tokio", "tls-rustls-ring-webpki"] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = ["uuid", "chrono", "json"] }
subtle = "=2.6.1"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time", "fs", "io-util"] }
toml = { version = "=0.8.23", default-features = false, features = ["parse", "preserve_order"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.6.11", features = ["request-id", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
url = "=2.5.8"
utoipa = "=6.0.0"
uuid = { version = "=1.26.1", features = ["serde"] }
whoami = { version = "=1.6.1", default-features = false }
zmij = "=1.0.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
