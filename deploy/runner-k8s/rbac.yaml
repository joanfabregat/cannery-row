# The runner's identity: Pods and volumes in its own namespace, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cannery-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cannery-runner
rules:
  # Step and transfer Pods: create, watch the phase, list and delete leftovers.
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete]
  # The step's log.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # tar in the transfer Pods. Exec over a WebSocket is a GET, authorized as
  # get, and since Kubernetes 1.30 also as create.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  # The per-job volume: create, list and delete leftovers, delete, and get
  # (to wait until a terminating one is gone).
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cannery-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cannery-runner
subjects:
  - kind: ServiceAccount
    name: cannery-runner
