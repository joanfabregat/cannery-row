# Demo project: sentiment classification of short reviews from a public toy
# corpus. Everything here is fictional demo data for dev/seed-demo.sh; see
# the header of that script for the format.
slug: demo-sentiment
title: "Demo: review sentiment"
description: >-
  Demo data. Binary sentiment classification of short movie and product
  reviews from a public toy corpus, from linear baselines to a small
  distilled encoder.
dataset_revision: toy-reviews-v2
members:
  ada: researcher
  ben: researcher
  chloe: member
  dev: member
  eli: viewer

tracks:
  - slug: linear-baselines
    title: Linear baselines
    description: Bag-of-words and n-gram features with linear classifiers. Cheap, fast and the yardstick for everything else.
    plan:
      by: ben
      approach: |
        Start from the TF-IDF unigram control and change one feature family at a time: word bigrams first, then character n-grams, then the classifier. Every unit keeps the tokenizer and the C grid of the control, so a gain can be traced to the feature change.

        Risks: sarcastic reviews (about 3%) cap any lexical model; a feature set that helps movies and hurts products does not count, so every unit reports the `domain` slice.
      review: {by: ada, reason: "One change per unit against the same control, and the domain slice is required everywhere. Approved."}
  - slug: small-encoders
    title: Small encoders
    description: Fine-tuning distilled transformer encoders under a 2 GPU-hour budget per run.
    plan:
      by: ada
      approach: |
        Fine-tune one distilled encoder against the bigram linear reference, then spend the remaining budget on what the first run shows: longer training, seed variance and an int8 version that meets the CPU latency budget.

        Edge cases: the 200 reviews a second constraint is measured on one CPU core, so an encoder that wins on macro-F1 but misses latency is a negative result, not a partial win.
      review: {by: ben, reason: "Follows from the encoder result and stays within the GPU budget."}
  - slug: augmentation
    title: Data augmentation
    description: Back-translation and synonym replacement to stretch the 9,600 training reviews.
    final: {state: paused, by: ben, reason: "Paused until the small-encoders track settles which model to augment for; no GPU budget left this month."}
  - slug: lexicon-rules
    title: Lexicon rules
    description: Hand-written polarity lexicons and negation rules, kept as an interpretable reference.
    final: {state: archived, by: ada, reason: "Rules are far behind the linear baselines on both domains; archived after #3 was rejected."}

brief:
  by: ada
  document: |
    ---
    title: Review sentiment
    goal: >-
      The most accurate binary sentiment classifier for short movie and
      product reviews that still runs on one CPU core at 200 reviews a
      second, judged on dev macro-F1 and confirmed once on test.
    ---
    # Domain

    Short English reviews (median 42 words) from the public toy corpus `toy-reviews-v2`, half movies and half products. Labels are the reviewers' own thumbs up or down; about 3% are sarcastic and mislabeled by any lexical model.

    # Constraints

    - Inference on one CPU core, at least 200 reviews a second.
    - Training at most 2 GPU-hours a run.
    - The test split is for confirmation only: never tune on it.

    # Conventions

    - Report macro-F1 overall and per `domain` slice; a hypothesis that helps one domain and hurts the other does not count.
    - Controls are named baselines (`tfidf-unigram-lr` r1) or earlier promoted hypotheses.

# Concerns about the plans, raised once the attempts are done: an open one
# holds up the small-encoders track, and a member's idea was dismissed.
concerns:
  - track: small-encoders
    by: agent
    from: {hypothesis: quantized-encoder, attempt: 1}
    kind: wrong_assumption
    body: |
      The plan measures the 200 reviews a second budget on one CPU core, and the quantized unit assumes that core runs int8 matrix products natively. The benchmark machine has no VNNI instructions: the int8 kernels fall back to a slower path, so quantization cannot halve p95 latency there whatever it does to macro-F1.

      I would measure latency on the production CPU type, or drop the quantized unit and plan a smaller encoder instead.
  - track: linear-baselines
    by: chloe
    kind: better_idea
    body: |
      Instead of one feature family at a time, a single run with a feature-selection sweep over unigrams, bigrams and character n-grams would find the best combination in one go.
    dismissed: {by: ben, reason: "The track changes one feature family at a time on purpose, so each gain can be traced to its change; a joint sweep would hide that."}

hypotheses:
  - key: bigrams
    doc:
      track: linear-baselines
      title: Add word bigrams to the TF-IDF features
      question: Do word bigrams on top of unigrams raise dev macro-F1 over the unigram control on both domains?
      rationale: Negations such as "not good" and "never again" are split by unigram features. Bigrams capture them at almost no inference cost.
      intervention: TF-IDF over unigrams and bigrams (min_df 2, sublinear tf), logistic regression with C tuned on a 5-fold split of train.
      control: {kind: baseline, id: tfidf-unigram-lr, revision: r1}
      plan:
        selection_splits: [dev]
        confirmation_splits: [test]
        primary_metric: macro_f1
        required_slices: [domain]
        success_criteria: Dev macro-F1 at least 0.01 above the control overall, and no domain below the control.
        falsification_criteria: Overall dev macro-F1 within 0.005 of the control, or either domain below it.
        regression_gates: [domain]
        compute_budget: {cpu_hours_max: 2}
      project_fields: {seed: 13, max_features: 200000}
    attempts:
      - by: agent
        stop: verified
        seconds: 1260
        candidate: {model: logistic-regression, features: tfidf-1-2gram, C: 4.0, min_df: 2, vocabulary_size: 184211}
        sheet:
          tried: Unigram plus bigram TF-IDF features with a tuned logistic regression.
          configuration: Code 7d41c2e; data toy-reviews-v2; control tfidf-unigram-lr r1. Inherited the tokenizer and the C grid; changed the n-gram range to (1, 2).
          observations: C=4 was best on all five folds. The vocabulary grows from 31k to 184k features; prediction time stays under 2 ms per review.
          findings: Dev macro-F1 rises from 0.812 to about 0.846, with the larger gain on product reviews.
          limitations: One seed only; the test split was not looked at.
          next_question: Does character n-gram information add anything on top of word bigrams?
          body: |
            # Word bigrams on TF-IDF

            ## What was tried
            The unigram control was extended with word bigrams (`ngram_range=(1, 2)`, `min_df=2`, sublinear tf). The logistic regression's `C` was tuned on a 5-fold split of train over `{0.5, 1, 2, 4, 8}`.

            ## Results (dev, claimed)

            | Slice | Control | This run |
            | --- | --- | --- |
            | overall | 0.812 | 0.847 |
            | movies | 0.821 | 0.851 |
            | products | 0.803 | 0.842 |

            Most of the gain comes from negated phrases: the bigram weights with the largest magnitude are `not worth`, `not bad`, `no complaints` and `waste of`.

            ## Caveats
            Single seed. Test split untouched, as the plan requires.
        results:
          - {metric: macro_f1, split: dev, claimed: 0.847, verified: 0.846, n: 1200, control: 0.812, ci: [0.833, 0.859]}
          - {metric: macro_f1, split: dev, dims: {domain: movies}, claimed: 0.851, verified: 0.851, n: 600, control: 0.821}
          - {metric: macro_f1, split: dev, dims: {domain: products}, claimed: 0.842, verified: 0.840, n: 600, control: 0.803}
          - {metric: accuracy, split: dev, claimed: 0.848, verified: 0.847, n: 1200}
          - {metric: latency_p95_ms, split: dev, claimed: 1.8, verified: 1.9, n: 1200}
        notes: Re-ran prediction from the submitted model on all 1,200 dev reviews; values match the claim within rounding.
        verdict:
          result: pass
          gates:
            - {id: primary-gain, result: pass, detail: "0.846 >= 0.812 + 0.01"}
            - {id: no-domain-regression, result: pass, detail: "movies 0.851 >= 0.821; products 0.840 >= 0.803"}
            - {id: latency-budget, result: pass, detail: "1.9 ms <= 20 ms"}
          reason: Every gate passes; dev macro-F1 is 0.034 above the control and both domains improve.
          compare:
            - {metric: macro_f1, split: dev, reference: {value: 0.812, label: "TF-IDF unigrams (control)", kind: baseline, ref: tfidf-unigram-lr}}
            - {metric: macro_f1, split: dev, dims: {domain: products}, reference: {value: 0.803, label: "TF-IDF unigrams (control)", kind: baseline, ref: tfidf-unigram-lr}}
        # The agent claims the document job and writes it up.
        writeup:
          by: agent
          summary: Bigram TF-IDF features lift dev macro-F1 by 0.034 over unigrams, on both domains, at under 2 ms per review.
          body: |-
            ## What was tried

            Unigram and bigram TF-IDF features with the same logistic regression as the control.

            ## What was found

            The verifier reproduced the claim: macro-F1 0.846 against 0.812, movies 0.851 and products 0.840, p95 latency 1.9 ms.

            ## What it means

            Bigrams capture short negations and product phrases the unigram model misses, for almost no cost.
        decision: {by: ada, action: promote, reason: "Clear gain on both domains with negligible cost. Bigram TF-IDF is now the linear reference for this project."}
    comments:
      - {by: ben, on: hypothesis, body: "Nice. The top bigram weights are almost all negations, which is exactly the failure mode we saw in the unigram error analysis."}
      - {by: ada, on: 1, body: "Promoted. @ben can you register this as a baseline in the next science revision so the encoder track compares against it?", edit: "Promoted. Ben, can you register this as a baseline in the next science revision so the small-encoders track compares against it?"}

  - key: char-ngrams
    doc:
      track: linear-baselines
      title: Character 3-5 grams instead of word n-grams
      question: Do character 3-5 grams beat word unigram features on dev macro-F1?
      rationale: Product reviews contain many misspellings and brand-like tokens that word features miss.
      intervention: TF-IDF over character 3-5 grams within word boundaries, same classifier and tuning as the control.
      control: {kind: baseline, id: tfidf-unigram-lr, revision: r1}
      plan:
        selection_splits: [dev]
        confirmation_splits: [test]
        primary_metric: macro_f1
        required_slices: [domain]
        success_criteria: Dev macro-F1 at least 0.01 above the control overall.
        falsification_criteria: Dev macro-F1 not above the control.
        regression_gates: [domain]
        compute_budget: {cpu_hours_max: 4}
      relations:
        - {kind: related_to, hypothesis: bigrams}
    attempts:
      - by: agent
        stop: verified
        seconds: 3480
        candidate: {model: logistic-regression, features: tfidf-char-3-5, C: 2.0, vocabulary_size: 612480}
        sheet:
          tried: Character 3-5 gram TF-IDF features, char_wb analyzer, tuned logistic regression.
          configuration: Code 7d41c2e; data toy-reviews-v2; control tfidf-unigram-lr r1. Changed the analyzer only.
          observations: Training took 20 times longer than the control and the model is 140 MB.
          findings: Dev macro-F1 is about the same as the control; movie reviews get slightly worse.
          limitations: No combination with word features was tried.
          next_question: Would char n-grams help as an addition to the bigram model rather than a replacement?
          body: |
            # Character n-grams

            Character 3-5 grams (`analyzer="char_wb"`) replaced the word features entirely.

            Dev macro-F1 lands at the control's level: products gain a little from misspelled words, movies lose a little because long-range phrasing is lost. The model is 140 MB and p95 latency is 11 ms.

            Not recommended as a replacement.
        results:
          - {metric: macro_f1, split: dev, claimed: 0.816, verified: 0.809, n: 1200, control: 0.812, ci: [0.795, 0.823]}
          - {metric: macro_f1, split: dev, dims: {domain: movies}, claimed: 0.812, verified: 0.806, n: 600, control: 0.821}
          - {metric: macro_f1, split: dev, dims: {domain: products}, claimed: 0.820, verified: 0.812, n: 600, control: 0.803}
          - {metric: accuracy, split: dev, claimed: 0.817, verified: 0.810, n: 1200}
          - {metric: latency_p95_ms, split: dev, claimed: 9.5, verified: 11.2, n: 1200}
        discrepancies:
          - {metric: macro_f1, split: dev, description: "The claimed 0.816 was computed with a different tie-break on equal scores; with the scorer's rule the value is 0.809."}
        notes: The submitted model reproduces 0.809, not the claimed 0.816; see the discrepancy.
        verdict:
          result: fail
          gates:
            - {id: primary-gain, result: fail, detail: "0.809 < 0.812 + 0.01"}
            - {id: no-domain-regression, result: fail, detail: "movies 0.806 < 0.821"}
            - {id: latency-budget, result: pass, detail: "11.2 ms <= 20 ms"}
          reason: The primary gain gate fails and movie reviews regress against the control.
          compare:
            - {metric: macro_f1, split: dev, reference: {value: 0.812, label: "TF-IDF unigrams (control)", kind: baseline, ref: tfidf-unigram-lr}}
        writeup:
          by: ben
          summary: Character n-grams do not beat the unigram control; the claimed gain came from a different tie-break, and movie reviews regress.
          body: |-
            ## What was tried

            Character 2-to-5-grams with a linear SVM.

            ## What was found

            The verifier measured 0.809 macro-F1, not the claimed 0.816: the agent broke ties on equal scores differently. Movie reviews drop to 0.806 against 0.821.

            ## What it means

            No gain for a model 30 times larger.
        decision: {by: ben, action: reject, reason: "No gain overall, a movie regression, and a model 30 times larger. Not worth pursuing as a replacement."}
    comments:
      - {by: dev, on: 1, body: "The discrepancy is the tie-break thing again. Should the agent instructions mention the scorer's rule (ties go to negative)?"}
      - {by: ben, on: 1, body: "Yes, added to the agent notes. Good catch."}

  - key: negation-lexicon
    doc:
      track: lexicon-rules
      title: Polarity lexicon with negation scope
      question: Can a polarity lexicon with a three-token negation scope reach the unigram control's dev macro-F1?
      rationale: An interpretable rule set would help explain classifier errors to non-specialists.
      intervention: Sum lexicon polarities, flip within three tokens after a negation cue, threshold tuned on train.
      control: {kind: baseline, id: tfidf-unigram-lr, revision: r1}
      plan:
        selection_splits: [dev]
        confirmation_splits: [dev]
        primary_metric: macro_f1
        required_slices: [domain]
        success_criteria: Dev macro-F1 within 0.03 of the control.
        falsification_criteria: Dev macro-F1 more than 0.03 below the control.
        regression_gates: []
        compute_budget: {cpu_hours_max: 1}
    attempts:
      - by: ben
        stop: verified
        seconds: 900
        candidate: {model: lexicon-rules, lexicon: demo-polarity-lexicon-v1, negation_scope: 3, threshold: 0.15}
        sheet:
          tried: Lexicon polarity sum with negation flipping, threshold tuned on train.
          configuration: Demo polarity lexicon v1 (6,800 entries); negation cues "not", "no", "never", "n't".
          observations: Sarcasm and comparisons ("better than the last one") are misclassified systematically.
          findings: Dev macro-F1 about 0.71, far below the control.
          limitations: No intensifiers or domain-specific terms.
          next_question: None in this track; rules are too far behind.
          body: |
            # Lexicon rules

            Dev macro-F1 is 0.712. Errors are dominated by sarcasm, comparisons and product jargon ("runs hot", "eats batteries") that the lexicon does not cover.
        results:
          - {metric: macro_f1, split: dev, claimed: 0.712, verified: 0.712, n: 1200, control: 0.812}
          - {metric: macro_f1, split: dev, dims: {domain: movies}, claimed: 0.734, verified: 0.734, n: 600}
          - {metric: macro_f1, split: dev, dims: {domain: products}, claimed: 0.690, verified: 0.690, n: 600}
        notes: Deterministic rules; reproduced exactly.
        verdict:
          result: fail
          gates:
            - {id: primary-gain, result: fail, detail: "0.712 < 0.812"}
            - {id: no-domain-regression, result: fail, detail: "both domains below the control"}
            - {id: latency-budget, result: pass}
          reason: Far below the control on both domains.
        # Skipped: the decision shows "No write-up" with the reason.
        writeup: {by: ada, skip: "The verification report and the error analysis in the run notes say everything."}
        decision: {by: ada, action: reject, reason: "As expected the rules are 0.10 behind. Keeping the error analysis, archiving the track."}

  - key: distilbert-base
    doc:
      track: small-encoders
      title: Fine-tune a distilled encoder for three epochs
      question: Does a fine-tuned distilled encoder beat the bigram TF-IDF model on dev macro-F1?
      rationale: Contextual encoders handle negation and sarcasm far better than bag-of-words features, and a distilled one fits the latency budget on CPU.
      intervention: Fine-tune a 66M-parameter distilled encoder, max length 256, 3 epochs, learning rate 3e-5, batch 32.
      control: {kind: baseline, id: tfidf-unigram-lr, revision: r1}
      plan:
        selection_splits: [dev]
        confirmation_splits: [test]
        primary_metric: macro_f1
        required_slices: [domain]
        success_criteria: Dev macro-F1 at least 0.02 above the bigram model (0.846), no domain regression, and p95 CPU latency under 20 ms per review.
        falsification_criteria: Dev macro-F1 below 0.846, or p95 latency above 20 ms.
        regression_gates: [domain, latency-budget]
        compute_budget: {gpu_hours_max: 2}
      project_fields: {seed: 7}
      relations:
        - {kind: derived_from, hypothesis: bigrams}
    attempts:
      - by: agent
        stop: released
        seconds: 1500
        release: "The GPU node was preempted twice during epoch 2 and the checkpoint was not saved; giving up this attempt."
        failure_decision: {by: ada, action: retry, reason: "Infrastructure problem, not a result. Retry once checkpoints are written every 500 steps."}
      - by: agent
        stop: verified
        seconds: 6900
        candidate: {model: distilled-encoder-66m, max_length: 256, epochs: 3, learning_rate: 3.0e-5, batch_size: 32, checkpoint_every: 500}
        sheet:
          tried: Fine-tuned a distilled encoder for 3 epochs with checkpoints every 500 steps.
          configuration: Code a19f03b; data toy-reviews-v2; seed 7. New in this attempt is checkpointing; everything else as in the approved plan.
          observations: Dev loss bottoms out in epoch 2; epoch 3 slightly overfits but macro-F1 is still highest there.
          findings: Dev macro-F1 about 0.90, well above the bigram model, with p95 CPU latency of 14 ms.
          limitations: One seed; latency measured on a 4-core laptop CPU.
          next_question: Does the gain hold with two more seeds and on the test split?
          body: |
            # Distilled encoder, 3 epochs

            Second attempt after the first one lost its GPU node; checkpoints are now written every 500 steps.

            | Slice | Bigram TF-IDF | Encoder |
            | --- | --- | --- |
            | overall | 0.846 | 0.902 |
            | movies | 0.851 | 0.915 |
            | products | 0.840 | 0.889 |

            p95 latency on CPU (batch 1, 256 tokens max): 14 ms.

            The largest gains are on sarcastic movie reviews, which the TF-IDF model labels positive almost every time.
        results:
          - {metric: macro_f1, split: dev, claimed: 0.902, verified: 0.901, n: 1200, control: 0.812, ci: [0.889, 0.912]}
          - {metric: macro_f1, split: dev, dims: {domain: movies}, claimed: 0.915, verified: 0.914, n: 600}
          - {metric: macro_f1, split: dev, dims: {domain: products}, claimed: 0.889, verified: 0.888, n: 600}
          - {metric: accuracy, split: dev, claimed: 0.903, verified: 0.902, n: 1200}
          - {metric: latency_p95_ms, split: dev, claimed: 14.0, verified: 15.2, n: 1200}
        notes: Latency re-measured on the verifier's reference CPU, slightly slower than claimed but within budget.
        verdict:
          result: pass
          gates:
            - {id: primary-gain, result: pass, detail: "0.901 >= 0.846 + 0.02"}
            - {id: no-domain-regression, result: pass}
            - {id: latency-budget, result: pass, detail: "15.2 ms <= 20 ms"}
          reason: All gates pass; a 0.055 gain over the bigram model within the latency budget.
          compare:
            - {metric: macro_f1, split: dev, reference: {value: 0.846, label: "Bigram TF-IDF (#1)", kind: promoted_attempt, ref: "demo-sentiment#1"}}
            - {metric: latency_p95_ms, split: dev, reference: {value: 20, label: "Latency budget", kind: manual}}
    comments:
      - {by: ben, on: hypothesis, body: "Before promoting I'd like a second seed. 0.90 from one run on 1,200 reviews has a CI of about ±0.012."}
      - {by: chloe, on: 2, body: "The 15 ms p95 is on the verifier's CPU. Our serving boxes are a bit faster, so there is some headroom."}

  - key: encoder-longer
    doc:
      track: small-encoders
      title: Train the distilled encoder for five epochs with early stopping
      question: Does training up to five epochs with early stopping on dev loss improve on the three-epoch encoder?
      rationale: The three-epoch run was still improving on products at the end of epoch 3.
      intervention: Same setup as the three-epoch encoder, up to 5 epochs, early stopping with patience 1 on dev loss.
      control: {kind: baseline, id: tfidf-unigram-lr, revision: r1}
      plan:
        selection_splits: [dev]
        confirmation_splits: [test]
        primary_metric: macro_f1
        required_slices: [domain]
        success_criteria: Dev macro-F1 above the three-epoch encoder by at least 0.005.
        falsification_criteria: Dev macro-F1 not above the three-epoch encoder.
        regression_gates: [domain, latency-budget]
        compute_budget: {gpu_hours_max: 3}
      project_fields: {seed: 7}
      relations:
        - {kind: derived_from, hypothesis: distilbert-base}
    attempts:
      - by: agent
        stop: verifying
        seconds: 9400
        candidate: {model: distilled-encoder-66m, max_length: 256, max_epochs: 5, early_stopping_patience: 1, learning_rate: 3.0e-5}
        sheet:
          tried: Up to five epochs with early stopping on dev loss.
          configuration: As the three-epoch encoder; changed max epochs and added early stopping.
          observations: Early stopping triggered after epoch 4.
          findings: Dev macro-F1 about 0.905, a marginal gain.
          limitations: One seed.
          next_question: Is the gain within seed noise?
          body: |
            # Encoder, early stopping

            Stopped after epoch 4. Dev macro-F1 0.905 (claimed) against 0.901 for the three-epoch run. Likely within seed noise.
        results:
          - {metric: macro_f1, split: dev, claimed: 0.905, verified: 0.904, n: 1200, control: 0.812}
          - {metric: macro_f1, split: dev, dims: {domain: movies}, claimed: 0.914, verified: 0.913, n: 600}
          - {metric: macro_f1, split: dev, dims: {domain: products}, claimed: 0.896, verified: 0.895, n: 600}
          - {metric: latency_p95_ms, split: dev, claimed: 14.0, verified: 15.1, n: 1200}
        notes: Reproduced within 0.001.

  - key: encoder-seeds
    doc:
      track: small-encoders
      title: Three-seed check of the distilled encoder
      question: Is the three-epoch encoder's dev macro-F1 stable across seeds 7, 21 and 42?
      rationale: A single seed cannot tell a 0.005 difference from noise; we need the spread before comparing variants.
      intervention: Re-run the three-epoch recipe with seeds 21 and 42 and report the mean and spread with seed 7.
      control: {kind: baseline, id: tfidf-unigram-lr, revision: r1}
      plan:
        selection_splits: [dev]
        confirmation_splits: [dev]
        primary_metric: macro_f1
        required_slices: [domain]
        success_criteria: Mean dev macro-F1 above 0.89 with a seed range under 0.01.
        falsification_criteria: Seed range above 0.02.
        regression_gates: []
        compute_budget: {gpu_hours_max: 4}
      relations:
        - {kind: related_to, hypothesis: distilbert-base}
    attempts:
      - by: agent
        stop: submitted
        seconds: 13200
        candidate: {model: distilled-encoder-66m, seeds: [7, 21, 42], epochs: 3}
        sheet:
          tried: The three-epoch recipe with seeds 7, 21 and 42.
          configuration: Unchanged recipe; seeds varied.
          observations: Seed 21 converged slower but ended close to the others.
          findings: Mean dev macro-F1 about 0.899, range 0.006.
          limitations: Three seeds only.
          next_question: Can #4 be promoted on this evidence?
          body: |
            # Three seeds

            | Seed | Dev macro-F1 |
            | --- | --- |
            | 7 | 0.902 |
            | 21 | 0.896 |
            | 42 | 0.899 |

            Mean 0.899, range 0.006.
        results:
          - {metric: macro_f1, split: dev, claimed: 0.899, n: 1200}
          - {metric: macro_f1, split: dev, dims: {domain: movies}, claimed: 0.911, n: 600}
          - {metric: macro_f1, split: dev, dims: {domain: products}, claimed: 0.887, n: 600}

  - key: quantized-encoder
    doc:
      track: small-encoders
      title: 8-bit dynamic quantization of the encoder
      question: Does 8-bit dynamic quantization keep dev macro-F1 within 0.005 of the float encoder while halving p95 latency?
      rationale: Halving latency would leave room for a larger encoder within the budget.
      intervention: Post-training dynamic int8 quantization of the linear layers of the three-epoch encoder.
      control: {kind: baseline, id: tfidf-unigram-lr, revision: r1}
      plan:
        selection_splits: [dev]
        confirmation_splits: [test]
        primary_metric: macro_f1
        required_slices: [domain]
        success_criteria: Macro-F1 within 0.005 of the float encoder and p95 latency at most 8 ms.
        falsification_criteria: Macro-F1 drops by more than 0.01.
        regression_gates: [latency-budget]
        compute_budget: {cpu_hours_max: 1}
