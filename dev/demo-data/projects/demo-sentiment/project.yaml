  - key: tfidf-svm
    doc:
      track: linear-baselines
      title: Linear SVM on the bigram features
      question: Does a linear SVM beat logistic regression on the same bigram TF-IDF features?
      rationale: SVMs often edge out logistic regression on sparse text features.
      intervention: Replace the logistic regression with a linear SVM (hinge loss), C tuned the same way, Platt scaling for scores.
      control: {kind: baseline, id: tfidf-unigram-lr, revision: r1}
      plan:
        selection_splits: [dev]
        confirmation_splits: [test]
        primary_metric: macro_f1
        required_slices: [domain]
        success_criteria: Dev macro-F1 at least 0.005 above the bigram logistic regression.
        falsification_criteria: Not above the bigram logistic regression.
        regression_gates: [domain]
        compute_budget: {cpu_hours_max: 1}
      relations:
        - {kind: related_to, hypothesis: bigrams}

  - key: backtranslation
    doc:
      track: augmentation
      title: Back-translation through French and German
      question: Does doubling the training set with back-translated reviews raise the encoder's dev macro-F1?
      rationale: Paraphrases add lexical variety without changing sentiment.
      intervention: Translate each training review to French and German and back, keep paraphrases with a similarity above 0.8, fine-tune the encoder on the union.
      control: {kind: baseline, id: tfidf-unigram-lr, revision: r1}
      plan:
        selection_splits: [dev]
        confirmation_splits: [test]
        primary_metric: macro_f1
        required_slices: [domain]
        success_criteria: Dev macro-F1 at least 0.005 above the encoder trained on the original data.
        falsification_criteria: No gain over the original-data encoder.
        regression_gates: [domain]
        compute_budget: {gpu_hours_max: 6}

  - key: synonym-swap
    doc:
      track: augmentation
      title: Synonym replacement for rare adjectives
      question: Does replacing rare adjectives with frequent synonyms in training reviews help the bigram model?
      rationale: Rare adjectives get almost no weight in the linear model.
      intervention: Replace adjectives seen fewer than 5 times with a frequent synonym from a thesaurus, 1 augmented copy per review.
      plan:
        selection_splits: [dev]
        confirmation_splits: [test]
        primary_metric: macro_f1
        required_slices: [domain]
        success_criteria: Dev macro-F1 above the bigram model.
        falsification_criteria: Not above the bigram model.
        regression_gates: []
        compute_budget: {cpu_hours_max: 1}
    later: {review: decline, by: ada, reason: "Synonym swaps flip sentiment too often (\"decent\" for \"great\"); the paraphrase approach in back-translation covers this better."}

  - key: label-noise
    doc:
      track: linear-baselines
      title: Estimate label noise with confident learning
      question: What fraction of the training labels are likely wrong, and does removing them change dev macro-F1?
      rationale: Some toy-corpus reviews look mislabeled (5-star text labeled negative). Knowing the noise rate sets a ceiling on what any model can reach.
      intervention: Out-of-fold probabilities from the bigram model, flag examples whose given label has a probability under 0.1, retrain without them.
      plan:
        selection_splits: [dev]
        confirmation_splits: [dev]
        primary_metric: macro_f1
        required_slices: []
        success_criteria: A noise estimate with a manual check of 100 flagged reviews.
        falsification_criteria: Fewer than half of the checked flags are real label errors.
        regression_gates: []
        compute_budget: {cpu_hours_max: 1}
    later: {review: pending}

